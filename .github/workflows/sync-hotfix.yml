name: Sync Hotfix Backport

on:
  push:
    branches:
      - main

concurrency:
  group: sync-hotfix
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  backport-hotfix:
    name: Backport Production Fixes (main → staging & dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and create backport PRs to staging and develop
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          # -------------------------------------------------------------
          # 1. Backport to staging (if main is ahead of staging)
          # -------------------------------------------------------------
          if git rev-parse --verify origin/staging >/dev/null 2>&1; then
            git fetch origin staging:staging

            COMMITS_AHEAD_STAGING=$(git rev-list --count staging..origin/main)
            if [ "$COMMITS_AHEAD_STAGING" -gt 0 ]; then
              echo "Found $COMMITS_AHEAD_STAGING commit(s) on 'main' not yet in 'staging'."

              EXISTING_PR=$(gh pr list --base staging --head main --state open --json number --jq '.[0].number')
              if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Backport PR #$EXISTING_PR already exists from main -> staging."
              else
                COMMIT_LOG=$(git log staging..origin/main --pretty=format:"- %h %s (%an)")
                cat <<EOF > pr_staging_body.md
          ## 🩹 Sync Hotfix: main → staging

          Automated backport pull request synchronizing critical production hotfixes from \`main\` back into Pre-Production / QA (\`staging\`).

          ### 📦 Sync Details
          - **Source Branch (Production):** \`main\`
          - **Target Branch (QA):** \`staging\`
          - **Triggered At:** ${TIMESTAMP}
          - **Commits Included:** ${COMMITS_AHEAD_STAGING}

          ### 📝 Hotfix Commits
          ${COMMIT_LOG}

          ### ⚠️ Action Required
          Please review and merge this PR into \`staging\` to ensure QA and subsequent release candidates do not regress or overwrite the production fix.
          EOF

                PR_URL=$(gh pr create \
                  --base staging \
                  --head main \
                  --title "🩹 Sync hotfix: main → staging" \
                  --body-file pr_staging_body.md)
                echo "✅ Created hotfix backport PR to staging: $PR_URL"
              fi
            else
              echo "✅ 'staging' is already up to date with 'main'."
            fi
          else
            echo "⚠️ Remote branch 'origin/staging' not found. Skipping staging backport."
          fi

          # -------------------------------------------------------------
          # 2. Backport to dev (if main is ahead of dev)
          # -------------------------------------------------------------
          if git rev-parse --verify origin/dev >/dev/null 2>&1; then
            git fetch origin dev:dev

            COMMITS_AHEAD_DEV=$(git rev-list --count dev..origin/main)
            if [ "$COMMITS_AHEAD_DEV" -gt 0 ]; then
              echo "Found $COMMITS_AHEAD_DEV commit(s) on 'main' not yet in 'dev'."

              EXISTING_PR=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
              if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Backport PR #$EXISTING_PR already exists from main -> dev."
              else
                COMMIT_LOG=$(git log dev..origin/main --pretty=format:"- %h %s (%an)")
                cat <<EOF > pr_dev_body.md
          ## 🩹 Sync Hotfix: main → dev

          Automated backport pull request synchronizing critical production hotfixes from \`main\` back into Development / Integration (\`dev\`).

          ### 📦 Sync Details
          - **Source Branch (Production):** \`main\`
          - **Target Branch (Integration):** \`dev\`
          - **Triggered At:** ${TIMESTAMP}
          - **Commits Included:** ${COMMITS_AHEAD_DEV}

          ### 📝 Hotfix Commits
          ${COMMIT_LOG}

          ### ⚠️ Action Required
          Please review and merge this PR into \`dev\` so active developer branches pulling from \`dev\` inherit the critical fix.
          EOF

                PR_URL=$(gh pr create \
                  --base dev \
                  --head main \
                  --title "🩹 Sync hotfix: main → dev" \
                  --body-file pr_dev_body.md)
                echo "✅ Created hotfix backport PR to dev: $PR_URL"
              fi
            else
              echo "✅ 'dev' is already up to date with 'main'."
            fi
          else
            echo "⚠️ Remote branch 'origin/dev' not found. Skipping dev backport."
          fi
