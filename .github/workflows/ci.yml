name: HMS Production CI

on:
  push:
    branches: [main, Sarthak]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/hms_test"
          JWT_SECRET: "test-jwt-secret-key-at-least-32-chars-long"
          JWT_REFRESH_SECRET: "test-jwt-refresh-secret-key-at-least-32-chars-long"
